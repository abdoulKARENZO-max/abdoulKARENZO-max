name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: abdoulKARENZO-max
          THEME: tokyonight

      - name: Generate Contribution Activity Graph SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: abdoulKARENZO-max
          outputs: |
            profile-cards/activity-graph.svg?palette=github-dark

      - name: Cache Typing SVG & GitHub Trophies SVG
        run: |
          mkdir -p profile-cards

          # 1. Cache Typing SVG locally so it never breaks
          curl -s "https://readme-typing-svg.demolab.com?font=Fira+Code&size=22&duration=3000&pause=1000&color=36BCF7¢er=true&vCenter=true&width=700&lines=Full-Stack+Developer;Cloud+DevOps+%26+Platform+Engineer;Mathematician;ML+%2F+AI+Automation+Engineer" -o profile-cards/typing.svg
          if ! grep -q "<svg" profile-cards/typing.svg; then
            git checkout -- profile-cards/typing.svg 2>/dev/null || rm -f profile-cards/typing.svg
          fi

          # 2. Cache GitHub Trophies SVG
          curl -s "https://github-trophies.vercel.app/?username=abdoulKARENZO-max&theme=tokyonight&no-frame=true&no-bg=true&margin-w=4&column=7" -o profile-cards/trophies.svg
          if ! grep -q "<svg" profile-cards/trophies.svg; then
            curl -s "https://github-profile-trophy.vercel.app/?username=abdoulKARENZO-max&theme=tokyonight&no-frame=true&no-bg=true&margin-w=4&column=7" -o profile-cards/trophies.svg
          fi
          if ! grep -q "<svg" profile-cards/trophies.svg; then
            git checkout -- profile-cards/trophies.svg 2>/dev/null || rm -f profile-cards/trophies.svg
          fi

      - name: Commit and Push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update profile stats, typing banner, trophies, and activity graph"
          git push
