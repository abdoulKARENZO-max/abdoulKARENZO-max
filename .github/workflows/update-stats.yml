name: Generate GitHub Profile Cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub Profile Summary Cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: abdoulKARENZO-max
          THEME: tokyonight

      - name: Generate Activity Graph SVG
        uses: Ashutosh00710/github-readme-activity-graph@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: abdoulKARENZO-max
          THEME: tokyonight
          BG_COLOR: 1a1b27
          COLOR: 70a5fd
          LINE: 5e81ac
          POINT: 88c0d0
          AREA: true
          HIDE_BORDER: true
          OUTPUT_DIR: profile-cards
          FILE_NAME: activity-graph.svg

      - name: Generate GitHub Trophies SVG
        run: |
          mkdir -p profile-cards
          curl -s "https://github-trophies.vercel.app/?username=abdoulKARENZO-max&theme=tokyonight&no-frame=true&no-bg=true&margin-w=4&column=7" -o profile-cards/trophies.svg
          if ! grep -q "<svg" profile-cards/trophies.svg; then
            curl -s "https://github-profile-trophy.vercel.app/?username=abdoulKARENZO-max&theme=tokyonight&no-frame=true&no-bg=true&margin-w=4&column=7" -o profile-cards/trophies.svg
          fi
          if ! grep -q "<svg" profile-cards/trophies.svg; then
            git checkout -- profile-cards/trophies.svg 2>/dev/null || rm -f profile-cards/trophies.svg
          fi

      - name: Commit and Push generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "Update profile stats, trophies, and activity graph"
          git push
